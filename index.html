<!DOCTYPE html>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{

body{

/* HEADER */

.store{

select{

.card{

        linear-gradient(145deg,#19002e,#0c0018);

}

.card:hover{
    transform:translateY(-7px);

        0 0 20px rgba(0,246,255,.3);
}

.cover{

}

/* MODAL */

.modal{

}

}

    font-family:'Press Start 2P';

}

    float:right;

}

.input{
    width:100%;

    padding:13px;

    margin-bottom:12px;

    background:#050008;

    border:1px solid var(--pink);

}

textarea.input{

}

.full{
    width:100%;
}

/* PROFILE */

.profile-head{

}

}

.avatar-placeholder{

}

/* CART */

.cart-item{
    display:flex;

    justify-content:space-between;

    gap:10px;

    padding:12px 0;

    border-bottom:1px solid #35203d;

}

.remove{

}

}

footer{

</head>

<body>

<header>

    <div class="logo">
        NEONBYTE <span>SHADY</span>
    </div>

    <div class="nav">

        <button
            class="btn"
            onclick="openCart()">

            🛒
            <span id="cartCount">0</span>

        </button>

        <button
            id="accountButton"
            class="btn pink"
            onclick="openAccount()">

            👤 INICIAR SESIÓN

        </button>

    </div>

</header>


<section class="hero">

    <h1>
        NEONBYTE SHADY
    </h1>

    <p>
        JUEGOS DIGITALES // 198X
    </p>

    <small>
        INSERT COIN • SELECT GAME • ENTER
    </small>

</section>


<main class="store">

    <h2 class="title">
        /// CATÁLOGO
    </h2>

    <div class="controls">

        <input
            id="search"
            class="search"
            placeholder="Buscar juego..."
            oninput="renderGames()"
        >

        <select
            id="filter"
            onchange="renderGames()">

            <option value="ALL">
                TODOS
            </option>

            <option value="STEAM">
                STEAM
            </option>

        </select>

    </div>

    <div
        id="games"
        class="games">
    </div>

</main>


<footer>

    NEONBYTE SHADY © 2026

    <br>

    DIGITAL GAME STORE

</footer>


<!-- CUENTA -->

<div
    id="accountModal"
    class="modal">

    <div class="box">

        <button
            class="close"
            onclick="closeModal('accountModal')">

            ×

        </button>

        <div
            id="accountContent">
        </div>

    </div>

</div>


<!-- CARRITO -->

<div
    id="cartModal"
    class="modal">

    <div class="box">

        <button
            class="close"
            onclick="closeModal('cartModal')">

            ×

        </button>

        <h2>
            🛒 MI CARRITO
        </h2>

        <div id="cartList"></div>

        <div class="discount">

            <input
                id="discountCode"
                placeholder="Código de descuento"
            >

            <button
                class="btn pink"
                onclick="applyDiscount()">

                APLICAR

            </button>

        </div>

        <div
            id="discountMessage"
            class="message">
        </div>

        <div
            id="cartTotal"
            class="total">

            $0

        </div>

        <button
            class="btn full"
            onclick="startPayment()">

            💳 CONTINUAR AL PAGO

        </button>

    </div>

</div>


<script>

/* =====================================================
   CATÁLOGO
===================================================== */

const defaultGames = [

    {
        id:1,

        name:"PAYDAY 2",

        platform:"STEAM",

        price:4000,

        appid:218620,

        image:"img/payday2.jpg",

        description:
        "Cooperativo de acción donde formas un equipo de criminales y realizas diferentes atracos."
    },

    {
        id:2,

        name:"PAYDAY 3",

        platform:"STEAM",

        price:12000,

        appid:1272080,

        image:"img/payday3.jpg",

        description:
        "Shooter cooperativo de atracos. Forma tu banda y completa grandes golpes junto a tus amigos."
    },

    {
        id:3,

        name:"METAL SLUG TACTICS",

        platform:"STEAM",

        price:5000,

        appid:1590760,

        image:"img/metal-slug-tactics.jpg",

        description:
        "Combina la acción clásica de Metal Slug con estrategia táctica por turnos."
    }

];


/* =====================================================
   JUEGOS
===================================================== */

let savedGames =
    JSON.parse(
        localStorage.getItem(
            "neonbyte_games"
        )
    );


let games =
    savedGames || defaultGames;


/*
   Si había una versión antigua guardada,
   aseguramos que los tres juegos existan.
*/

function ensureDefaultGames(){

    defaultGames.forEach(defaultGame => {

        const existing =
            games.find(
                game =>
                    Number(game.id) ===
                    Number(defaultGame.id)
            );

        if(!existing){

            games.push(defaultGame);

        }

    });

    saveGames();

}

function saveGames(){

    localStorage.setItem(
        "neonbyte_games",
        JSON.stringify(games)
    );

}

ensureDefaultGames();


/* =====================================================
   CARRITO
===================================================== */

let cart =
    JSON.parse(
        localStorage.getItem(
            "neonbyte_cart"
        )
    ) || [];


function saveCart(){

    localStorage.setItem(
        "neonbyte_cart",
        JSON.stringify(cart)
    );

}


function addCart(id){

    const game =
        games.find(
            g =>
                Number(g.id) ===
                Number(id)
        );

    if(!game){

        return;

    }

    cart.push(game);

    saveCart();

    updateCart();

    alert(
        game.name +
        " fue agregado al carrito."
    );

}


function updateCart(){

    document.getElementById(
        "cartCount"
    ).textContent =
        cart.length;

}


function openCart(){

    renderCart();

    document.getElementById(
        "cartModal"
    ).style.display =
        "flex";

}


function renderCart(){

    const list =
        document.getElementById(
            "cartList"
        );

    if(cart.length === 0){

        list.innerHTML =
            `<p class="message">
                Tu carrito está vacío.
            </p>`;

        document.getElementById(
            "cartTotal"
        ).textContent =
            "$0";

        return;

    }

    list.innerHTML =
        cart.map(
            (game,index) => `

                <div class="cart-item">

                    <span>
                        ${escapeHTML(game.name)}
                    </span>

                    <span>

                        ${price(game.price)}

                        <button
                            class="remove"
                            onclick="removeCart(${index})">

                            ×

                        </button>

                    </span>

                </div>

            `
        ).join("");

    calculateTotal();

}


function removeCart(index){

    cart.splice(index,1);

    saveCart();

    updateCart();

    renderCart();

}


/* =====================================================
   DESCUENTOS
===================================================== */

let discount = 0;


function applyDiscount(){

    const code =
        document.getElementById(
            "discountCode"
        ).value
        .trim()
        .toUpperCase();

    const message =
        document.getElementById(
            "discountMessage"
        );

    if(code === "SHADY10"){

        discount = 0.10;

        message.textContent =
            "✓ 10% DE DESCUENTO APLICADO";

    }

    else if(code === "NEON20"){

        discount = 0.20;

        message.textContent =
            "✓ 20% DE DESCUENTO APLICADO";

    }

    else{

        discount = 0;

        message.textContent =
            "✕ CÓDIGO NO VÁLIDO";

    }

    calculateTotal();

}


function calculateTotal(){

    const subtotal =
        cart.reduce(
            (sum,game) =>
                sum +
                Number(game.price),
            0
        );

    const total =
        Math.round(
            subtotal -
            subtotal * discount
        );

    document.getElementById(
        "cartTotal"
    ).textContent =
        price(total);

}


/* =====================================================
   CUENTAS
===================================================== */

let user =
    JSON.parse(
        localStorage.getItem(
            "neonbyte_user"
        )
    ) || null;


function saveUser(){

    localStorage.setItem(
        "neonbyte_user",
        JSON.stringify(user)
    );

}


function openAccount(){

    renderAccount();

    document.getElementById(
        "accountModal"
    ).style.display =
        "flex";

}


function renderAccount(){

    const area =
        document.getElementById(
            "accountContent"
        );


    if(!user){

        area.innerHTML = `

            <h2>
                👤 NEONBYTE ACCOUNT
            </h2>

            <p class="message">
                Crea tu cuenta o inicia sesión.
            </p>

            <input
                id="registerName"
                class="input"
                placeholder="Nombre"
            >

            <input
                id="registerEmail"
                class="input"
                type="email"
                placeholder="Correo electrónico"
            >

            <input
                id="registerPassword"
                class="input"
                type="password"
                placeholder="Contraseña"
            >

            <button
                class="btn pink full"
                onclick="register()">

                CREAR CUENTA

            </button>

            <hr>

            <input
                id="loginEmail"
                class="input"
                type="email"
                placeholder="Correo"
            >

            <input
                id="loginPassword"
                class="input"
                type="password"
                placeholder="Contraseña"
            >

            <button
                class="btn full"
                onclick="login()">

                INICIAR SESIÓN

            </button>

            <p
                id="accountMessage"
                class="message">
            </p>

        `;

        return;

    }


    area.innerHTML = `

        <div class="profile-head">

            ${
                user.image
                ?
                `<img
                    src="${escapeAttribute(user.image)}"
                    class="avatar"
                    alt="Avatar"
                >`
                :
                `<div class="avatar-placeholder">
                    👤
                </div>`
            }

            <div class="profile-name">

                ${escapeHTML(user.name)}

            </div>

            <div class="profile-email">

                ${escapeHTML(user.email)}

            </div>

        </div>

        <h2 style="margin-top:25px">

            MI PERFIL

        </h2>

        <input
            id="profileName"
            class="input"
            value="${escapeAttribute(user.name)}"
            placeholder="Nombre"
        >

        <label
            class="btn full"
            style="
                display:block;
                text-align:center;
                margin-bottom:12px;
            ">

            🖼️ CAMBIAR IMAGEN

            <input
                type="file"
                accept="image/*"
                style="display:none"
                onchange="changeImage(event)"
            >

        </label>

        <textarea
            id="profileComment"
            class="input"
            rows="4"
            placeholder="Escribe algo sobre ti..."
        >${escapeHTML(user.comment || "")}</textarea>

        <button
            class="btn pink full"
            onclick="saveProfile()">

            GUARDAR PERFIL

        </button>

        <button
            class="btn full"
            style="margin-top:20px"
            onclick="logout()">

            🚪 CERRAR SESIÓN

        </button>

    `;

}


function register(){

    const name =
        document.getElementById(
            "registerName"
        ).value.trim();

    const email =
        document.getElementById(
            "registerEmail"
        ).value.trim()
        .toLowerCase();

    const password =
        document.getElementById(
            "registerPassword"
        ).value;

    const message =
        document.getElementById(
            "accountMessage"
        );


    if(
        !name ||
        !email ||
        !password
    ){

        message.textContent =
            "Completa todos los campos.";

        return;

    }


    if(password.length < 6){

        message.textContent =
            "La contraseña debe tener al menos 6 caracteres.";

        return;

    }


    const accounts =
        JSON.parse(
            localStorage.getItem(
                "neonbyte_accounts"
            )
        ) || [];


    if(
        accounts.some(
            account =>
                account.email === email
        )
    ){

        message.textContent =
            "Ese correo ya está registrado.";

        return;

    }


    const account = {

        name:name,

        email:email,

        password:password,

        image:"",

        comment:""

    };


    accounts.push(account);


    localStorage.setItem(
        "neonbyte_accounts",
        JSON.stringify(accounts)
    );


    user = {

        name:name,

        email:email,

        image:"",

        comment:""

    };


    saveUser();

    updateAccountButton();

    renderAccount();

}


function login(){

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim()
        .toLowerCase();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;

    const message =
        document.getElementById(
            "accountMessage"
        );


    const accounts =
        JSON.parse(
            localStorage.getItem(
                "neonbyte_accounts"
            )
        ) || [];


    const account =
        accounts.find(
            a =>
                a.email === email &&
                a.password === password
        );


    if(!account){

        message.textContent =
            "Correo o contraseña incorrectos.";

        return;

    }


    user = {

        name:account.name,

        email:account.email,

        image:account.image || "",

        comment:account.comment || ""

    };


    saveUser();

    updateAccountButton();

    renderAccount();

}


function changeImage(event){

    const file =
        event.target.files[0];

    if(!file){

        return;

    }


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        alert(
            "Selecciona una imagen válida."
        );

        return;

    }


    if(
        file.size >
        2 * 1024 * 1024
    ){

        alert(
            "La imagen debe pesar menos de 2 MB."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(){

            user.image =
                reader.result;

            saveUser();

            renderAccount();

        };


    reader.readAsDataURL(file);

}


function saveProfile(){

    const name =
        document.getElementById(
            "profileName"
        );

    const comment =
        document.getElementById(
            "profileComment"
        );


    if(name){

        user.name =
            name.value.trim() ||
            user.name;

    }


    if(comment){

        user.comment =
            comment.value.trim();

    }


    saveUser();


    const accounts =
        JSON.parse(
            localStorage.getItem(
                "neonbyte_accounts"
            )
        ) || [];


    const index =
        accounts.findIndex(
            a =>
                a.email === user.email
        );


    if(index !== -1){

        accounts[index].name =
            user.name;

        accounts[index].image =
            user.image;

        accounts[index].comment =
            user.comment;


        localStorage.setItem(
            "neonbyte_accounts",
            JSON.stringify(accounts)
        );

    }


    updateAccountButton();

    renderAccount();

}


function logout(){

    user = null;

    localStorage.removeItem(
        "neonbyte_user"
    );

    updateAccountButton();

    renderAccount();

}


function updateAccountButton(){

    const button =
        document.getElementById(
            "accountButton"
        );


    if(user){

        button.textContent =
            "👤 " +
            user.name;

    }

    else{

        button.textContent =
            "👤 INICIAR SESIÓN";

    }

}


/* =====================================================
   PAGOS
===================================================== */

function startPayment(){

    if(cart.length === 0){

        alert(
            "Tu carrito está vacío."
        );

        return;

    }


    if(!user){

        alert(
            "Debes iniciar sesión antes de comprar."
        );

        closeModal(
            "cartModal"
        );

        openAccount();

        return;

    }


    /*
       AQUÍ irá posteriormente Mercado Pago.

       No colocamos Access Token aquí.
    */

    alert(
        "Tu carrito está listo para el pago."
    );

}


/* =====================================================
   UTILIDADES
===================================================== */

function price(value){

    return "$" +
        Number(value)
        .toLocaleString(
            "es-CL"
        );

}


function escapeHTML(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =====================================================
   RENDER JUEGOS
===================================================== */

function renderGames(){

    const container =
        document.getElementById(
            "games"
        );


    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase();


    const filter =
        document.getElementById(
            "filter"
        ).value;


    const result =
        games.filter(
            game => {

                const searchOK =
                    game.name
                    .toLowerCase()
                    .includes(search);


                const filterOK =
                    filter === "ALL" ||
                    game.platform === filter;


                return (
                    searchOK &&
                    filterOK
                );

            }
        );


    if(result.length === 0){

        container.innerHTML = `

            <p class="message">

                No se encontraron juegos.

            </p>

        `;

        return;

    }


    container.innerHTML =
        result.map(
            game => {

                const image =
                    game.image
                    ?
                    `

                    <img
                        class="cover"
                        src="${escapeAttribute(game.image)}"
                        alt="${escapeAttribute(game.name)}"
                        onerror="this.outerHTML='<div class=&quot;coverFallback&quot;>${escapeHTML(game.name)}</div>'"
                    >

                    `
                    :
                    `

                    <div class="coverFallback">

                        ${escapeHTML(game.name)}

                    </div>

                    `;


                return `

                    <article class="card">

                        ${image}

                        <h3>

                            ${escapeHTML(game.name)}

                        </h3>

                        <div class="platform">

                            ${escapeHTML(game.platform)}

                        </div>

                        <div class="description">

                            ${escapeHTML(
                                game.description ||
                                "Juego digital disponible en NEONBYTE SHADY."
                            )}

                        </div>

                        <div class="price">

                            ${price(game.price)}

                        </div>

                        <button
                            class="buy"
                            onclick="addCart(${game.id})">

                            🛒 COMPRAR

                        </button>

                    </article>

                `;

            }
        ).join("");

}


/* =====================================================
   MODALES
===================================================== */

function closeModal(id){

    document.getElementById(
        id
    ).style.display =
        "none";

}


window.onclick =
function(event){

    if(
        event.target.classList
        .contains("modal")
    ){

        event.target.style.display =
            "none";

    }

};


/* =====================================================
   INICIO
===================================================== */

renderGames();

updateCart();

updateAccountButton();

</script>
